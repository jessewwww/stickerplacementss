<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sticker Map Placer</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div>
        <h1>🏷️ Sticker Map</h1>
        <p>Plak je sticker op de kaart</p>
      </div>

      <div class="counter">
        <strong id="stickerCount">0</strong>
        <span>stickers</span>
      </div>
    </header>


    <div class="search">
      <input
        id="search"
        type="text"
        placeholder="Zoek een plaats..."
        autocomplete="off"
      >

      <button onclick="searchPlace()">
        🔍
      </button>
    </div>


    <main id="map"></main>


    <button
      id="placeButton"
      class="placeButton"
      onclick="startPlacement()"
    >
      📍 Sticker plaatsen
    </button>


    <div
      id="centerMarker"
      class="centerMarker"
      style="display:none"
    >
      <div>🏷️</div>
    </div>


    <div
      id="placeBar"
      class="placeBar"
      style="display:none"
    >
      <button onclick="cancelPlacement()" class="cancel">
        Annuleren
      </button>

      <button onclick="chooseLocation()" class="confirm">
        📍 Deze plek kiezen
      </button>
    </div>


    <div
      id="modalBackground"
      class="modalBackground"
      style="display:none"
    ></div>


    <div
      id="modal"
      class="modal"
      style="display:none"
    >
      <div class="modalBox">

        <button
          class="close"
          onclick="closeModal()"
        >
          ×
        </button>

        <div class="modalIcon">
          🏷️
        </div>

        <h2>Nieuwe sticker</h2>

        <p>
          Wat wil je op deze plek achterlaten?
        </p>

        <textarea
          id="stickerText"
          maxlength="100"
          placeholder="Schrijf iets..."
        ></textarea>

        <div class="characterCount">
          Maximaal 100 tekens
        </div>

        <button
          class="publish"
          onclick="publishSticker()"
        >
          Sticker plaatsen
        </button>

      </div>
    </div>


    <div
      id="saveOverlay"
      class="saveOverlay"
      style="display:none"
    >
      <div class="saveBox">

        <div
          id="loadingCircle"
          class="loading"
        ></div>

        <div
          id="successIcon"
          class="success"
          style="display:none"
        >
          ✓
        </div>

        <h2 id="saveTitle">
          Sticker plaatsen...
        </h2>

        <p id="saveSub">
          Even geduld
        </p>

        <h2
          id="successTitle"
          style="display:none"
        >
          Sticker geplaatst!
        </h2>

        <p
          id="successSub"
          style="display:none"
        >
          Je sticker staat op de kaart 🎉
        </p>

      </div>
    </div>


    <div
      id="notification"
      class="notification"
      style="display:none"
    >
      ✓ Sticker geplaatst!
    </div>

  </div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="script.js"></script>

</body>
</html>
