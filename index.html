<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Stickerkaart</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Eigen CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <header class="header">

    <div class="logo">
      🏷️ Stickerkaart
    </div>

    <div class="counter">
      <span id="stickerCount">0</span>
      stickers
    </div>

  </header>


  <!-- ========================= -->
  <!-- ZOEKEN -->
  <!-- ========================= -->

  <div class="searchBar">

    <input
      type="text"
      id="search"
      placeholder="Zoek een plaats..."
      autocomplete="off"
    >

    <button
      type="button"
      onclick="searchPlace()"
    >
      🔍 Zoeken
    </button>

  </div>


  <!-- ========================= -->
  <!-- KAART -->
  <!-- ========================= -->

  <div id="map"></div>


  <!-- ========================= -->
  <!-- STICKER PLAATSEN KNOP -->
  <!-- ========================= -->

  <button
    class="addButton"
    type="button"
    onclick="startPlacement()"
  >
    ➕ Sticker plaatsen
  </button>


  <!-- ========================= -->
  <!-- CENTER MARKER -->
  <!-- ========================= -->

  <div
    id="centerMarker"
    style="display: none;"
  >
    <div class="centerMarkerIcon">
      📍
    </div>
  </div>


  <!-- ========================= -->
  <!-- PLAATS BAR -->
  <!-- ========================= -->

  <div
    id="placeBar"
    style="display: none;"
  >

    <button
      type="button"
      onclick="cancelPlacement()"
    >
      Annuleren
    </button>

    <button
      type="button"
      onclick="chooseLocation()"
    >
      📍 Deze plek kiezen
    </button>

  </div>


  <!-- ========================= -->
  <!-- MODAL ACHTERGROND -->
  <!-- ========================= -->

  <div
    id="modalBackground"
    style="display: none;"
    onclick="closeModal()"
  ></div>


  <!-- ========================= -->
  <!-- MODAL -->
  <!-- ========================= -->

  <div
    id="modal"
    style="display: none;"
  >

    <div class="modalContent">

      <button
        class="closeButton"
        type="button"
        onclick="closeModal()"
      >
        ×
      </button>

      <h2>🏷️ Sticker plaatsen</h2>

      <p>
        Geef je sticker een tekst.
      </p>

      <textarea
        id="stickerText"
        placeholder="Schrijf iets..."
        maxlength="100"
      ></textarea>

      <button
        class="publishButton"
        type="button"
        onclick="publishSticker()"
      >
        Sticker publiceren
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- OPSLAAN OVERLAY -->
  <!-- ========================= -->

  <div
    id="saveOverlay"
    style="display: none;"
  >

    <div class="saveBox">

      <div
        id="loadingCircle"
        class="loadingCircle"
      >
      </div>

      <div
        id="successIcon"
        class="successIcon"
        style="display: none;"
      >
        ✓
      </div>

      <h2 id="saveTitle">
        Sticker opslaan...
      </h2>

      <p id="saveSub">
        Even geduld...
      </p>

      <h2
        id="successTitle"
        style="display: none;"
      >
        Sticker geplaatst!
      </h2>

      <p
        id="successSub"
        style="display: none;"
      >
        Je sticker staat nu op de kaart.
      </p>

    </div>

  </div>


  <!-- ========================= -->
  <!-- NOTIFICATIE -->
  <!-- ========================= -->

  <div
    id="notification"
    style="display: none;"
  >
    Sticker geplaatst! 🎉
  </div>


  <!-- ========================= -->
  <!-- LEAFLET JAVASCRIPT -->
  <!-- ========================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>


  <!-- ========================= -->
  <!-- EIGEN JAVASCRIPT -->
  <!-- ========================= -->

  <script src="script.js"></script>

</body>
</html>
