<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sticker Map Placer</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🏷️ Sticker Map Placer</h1>

    <div class="counter">
      <span id="stickerCount">0</span>
      stickers
    </div>
  </header>


  <div class="toolbar">

    <input
      id="search"
      type="text"
      placeholder="Zoek locatie..."
    >

    <button onclick="searchPlace()">
      🔎 Zoek
    </button>

    <button onclick="startPlacement()">
      📍 Sticker plaatsen
    </button>

  </div>


  <div id="map"></div>


  <!-- Middenpunt tijdens plaatsen -->

  <div
    id="centerMarker"
    class="center-marker"
    style="display:none;"
  >
    📍
  </div>


  <!-- Onderste plaatsbalk -->

  <div
    id="placeBar"
    class="place-bar"
    style="display:none;"
  >

    <button onclick="cancelPlacement()">
      Annuleren
    </button>

    <button onclick="chooseLocation()">
      📍 Deze locatie kiezen
    </button>

  </div>


  <!-- Sticker modal -->

  <div
    id="modalBackground"
    class="modal-background"
    style="display:none;"
  ></div>


  <div
    id="modal"
    class="modal"
    style="display:none;"
  >

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal()"
      >
        ×
      </button>

      <h2>🏷️ Sticker plaatsen</h2>

      <p id="selectedLocation"></p>

      <textarea
        id="stickerText"
        maxlength="100"
        placeholder="Wat wil je op deze locatie zetten?"
      ></textarea>

      <button
        class="publish"
        onclick="publishSticker()"
      >
        🏷️ Sticker plaatsen
      </button>

    </div>

  </div>


  <!-- Google Maps -->

  <script
    src="https://maps.googleapis.com/maps/api/js?key=JOUW_GOOGLE_MAPS_API_KEY&libraries=marker&callback=initMap"
    async
    defer
  ></script>

  <script src="script.js"></script>

</body>
</html>
