<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stickerkaart Nederland</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

/* =========================
   BASIS
========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f5f5f7;
}


/* =========================
   BOVENBALK
========================= */

#topbar {

  height: 65px;

  background: white;

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 10px 15px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.12);

  position: relative;

  z-index: 3000;
}


#logo {

  font-size: 20px;

  font-weight: 700;

  white-space: nowrap;

}


#search {

  flex: 1;

  min-width: 80px;

  padding: 11px 14px;

  border: 1px solid #d2d2d7;

  border-radius: 10px;

  font-size: 15px;

  outline: none;

}


#search:focus {

  border-color: #007aff;

  box-shadow:
    0 0 0 3px rgba(0,122,255,.12);

}


#searchBtn {

  border: none;

  background: #007aff;

  color: white;

  padding: 11px 16px;

  border-radius: 10px;

  cursor: pointer;

  font-weight: 600;

}


#searchBtn:hover {

  background: #0066d6;

}


/* =========================
   PLUS KNOP
========================= */

#addBtn {

  width: 45px;

  height: 45px;

  border: none;

  border-radius: 50%;

  background: #007aff;

  color: white;

  font-size: 30px;

  line-height: 45px;

  cursor: pointer;

  box-shadow:
    0 3px 8px rgba(0,0,0,.2);

}


#addBtn:hover {

  transform: scale(1.05);

}


/* =========================
   TELLER
========================= */

#counter {

  position: fixed;

  top: 78px;

  right: 15px;

  z-index: 2000;

  background: rgba(255,255,255,.96);

  padding: 12px 17px;

  border-radius: 13px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.2);

  font-weight: 700;

  backdrop-filter: blur(10px);

}


/* =========================
   KAART
========================= */

#map {

  width: 100%;

  height:
    calc(100vh - 65px);

}


/* =========================
   CENTRUM KRUIS
========================= */

#centerMarker {

  display: none;

  position: fixed;

  left: 50%;

  top: calc(50% + 32px);

  transform:
    translate(-50%, -50%);

  z-index: 1500;

  pointer-events: none;

  color: #ff3b30;

  font-size: 48px;

  font-weight: 400;

  text-shadow:
    0 0 4px white,
    0 0 10px white;

}


/* =========================
   PLAATSINGSBALK
========================= */

#placeBar {

  display: none;

  position: fixed;

  left: 50%;

  bottom: 20px;

  transform:
    translateX(-50%);

  z-index: 4000;

  background:
    rgba(255,255,255,.97);

  padding: 14px;

  border-radius: 16px;

  box-shadow:
    0 8px 35px rgba(0,0,0,.25);

  text-align: center;

  backdrop-filter: blur(15px);

}


#placeBarText {

  font-size: 14px;

  margin-bottom: 7px;

  color: #444;

}


#placeBar button {

  border: none;

  padding: 11px 16px;

  margin: 4px;

  border-radius: 9px;

  cursor: pointer;

  font-weight: 700;

}


#placeHere {

  background: #34c759;

  color: white;

}


#placeHere:hover {

  background: #28a745;

}


#cancelPlace {

  background: #e5e5ea;

  color: #222;

}


/* =========================
   STICKER
========================= */

.sticker {

  width: 62px;

  height: 62px;

  background:
    linear-gradient(
      145deg,
      #fff500,
      #ffd900
    );

  border:
    3px solid #c7ad00;

  border-radius: 50%;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 7px;

  text-align: center;

  font-size: 12px;

  font-weight: 800;

  color: #222;

  box-shadow:
    0 4px 12px rgba(0,0,0,.35);

  overflow: hidden;

  word-break: break-word;

  transition:
    transform .15s ease;

}


.sticker:hover {

  transform: scale(1.12);

}


/* =========================
   NOTIFICATIE
========================= */

#notification {

  display: none;

  position: fixed;

  top: 75px;

  right: 20px;

  z-index: 10000;

  background: #1c1c1e;

  color: white;

  padding: 15px 20px;

  border-radius: 14px;

  box-shadow:
    0 6px 25px rgba(0,0,0,.3);

  font-weight: 700;

}


/* =========================
   MODAL ACHTERGROND
========================= */

#modalBackground {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,.45);

  z-index: 5000;

  backdrop-filter:
    blur(5px);

}


/* =========================
   MODAL
========================= */

#modal {

  display: none;

  position: fixed;

  left: 50%;

  top: 50%;

  transform:
    translate(-50%, -50%);

  width: min(330px, 90%);

  background: white;

  padding: 24px;

  border-radius: 20px;

  z-index: 5001;

  box-shadow:
    0 15px 50px rgba(0,0,0,.35);

}


#modal h2 {

  margin-top: 0;

}


#stickerText {

  width: 100%;

  padding: 13px;

  border: 1px solid #d2d2d7;

  border-radius: 10px;

  font-size: 16px;

  outline: none;

}


#stickerText:focus {

  border-color: #007aff;

}


.modalButtons {

  display: flex;

  gap: 8px;

  margin-top: 16px;

}


.modalButtons button {

  flex: 1;

  padding: 12px;

  border: none;

  border-radius: 10px;

  cursor: pointer;

  font-weight: 700;

}


#publish {

  background: #007aff;

  color: white;

}


#cancel {

  background: #e5e5ea;

}


/* =========================
   DELETE BUTTON
========================= */

.delete {

  width: 100%;

  padding: 10px;

  border: none;

  border-radius: 9px;

  background: #ff3b30;

  color: white;

  cursor: pointer;

  font-weight: 700;

}


/* =========================
   SAVE OVERLAY
========================= */

#saveOverlay {

  display: none;

  position: fixed;

  inset: 0;

  z-index: 99999;

  background:
    rgba(255,255,255,.72);

  backdrop-filter:
    blur(18px);

  align-items: center;

  justify-content: center;

}


/* =========================
   SAVE BOX
========================= */

#saveBox {

  width: 300px;

  padding: 32px 22px;

  background:
    rgba(255,255,255,.96);

  border-radius: 28px;

  text-align: center;

  box-shadow:
    0 20px 70px rgba(0,0,0,.22);

  animation:
    boxAppear .3s ease;

}


@keyframes boxAppear {

  from {

    opacity: 0;

    transform:
      scale(.92);

  }

  to {

    opacity: 1;

    transform:
      scale(1);

  }

}


/* =========================
   SPINNER
========================= */

#loadingCircle {

  width: 58px;

  height: 58px;

  margin:
    0 auto 20px;

  border-radius: 50%;

  border:
    5px solid #e5e5ea;

  border-top-color:
    #007aff;

  animation:
    spin .8s linear infinite;

}


@keyframes spin {

  to {

    transform:
      rotate(360deg);

  }

}


/* =========================
   SAVE TEKST
========================= */

#saveTitle {

  font-size: 19px;

  font-weight: 700;

  margin-bottom: 7px;

}


#saveSub {

  font-size: 14px;

  color: #777;

}


/* =========================
   SUCCES ICOON
========================= */

#successIcon {

  display: none;

  width: 76px;

  height: 76px;

  margin:
    0 auto 18px;

  border-radius: 50%;

  background: #34c759;

  color: white;

  font-size: 48px;

  line-height: 76px;

  font-weight: 700;

  animation:
    successPop .5s
    cubic-bezier(.17,.67,.35,1.4);

}


@keyframes successPop {

  0% {

    transform:
      scale(0);

    opacity: 0;

  }

  70% {

    transform:
      scale(1.15);

    opacity: 1;

  }

  100% {

    transform:
      scale(1);

  }

}


/* =========================
   SUCCES TEKST
========================= */

#successTitle {

  display: none;

  font-size: 21px;

  font-weight: 800;

}


#successSub {

  display: none;

  margin-top: 8px;

  color: #666;

}


/* =========================
   MOBIEL
========================= */

@media (max-width: 600px) {

  #logo {

    display: none;

  }

  #searchBtn {

    padding:
      11px 12px;

  }

  #counter {

    top: 75px;

    right: 10px;

    padding:
      10px 13px;

  }

  #placeBar {

    width: 92%;

  }

}

</style>

</head>


<body>


<!-- =========================
     TOPBAR
========================= -->

<div id="topbar">

  <div id="logo">
    📍 Stickerkaart
  </div>

  <input
    id="search"
    type="text"
    placeholder="🔎 Zoek plaats..."
  >

  <button
    id="searchBtn"
    onclick="searchPlace()"
  >
    Zoek
  </button>

  <button
    id="addBtn"
    onclick="startPlacement()"
    title="Sticker plaatsen"
  >
    +
  </button>

</div>


<!-- =========================
     TELLER
========================= -->

<div id="counter">

  🏷️ Stickers:
  <span id="stickerCount">0</span>

</div>


<!-- =========================
     KAART
========================= -->

<div id="map"></div>


<!-- =========================
     CENTRUM KRUIS
========================= -->

<div id="centerMarker">
  ✚
</div>


<!-- =========================
     PLAATSINGSBALK
========================= -->

<div id="placeBar">

  <div id="placeBarText">

    📍 Versleep de kaart
    totdat het kruis op de juiste plek staat.

  </div>

  <button
    id="placeHere"
    onclick="chooseLocation()"
  >
    📌 Sticker hier
  </button>

  <button
    id="cancelPlace"
    onclick="cancelPlacement()"
  >
    Annuleren
  </button>

</div>


<!-- =========================
     NOTIFICATIE
========================= -->

<div id="notification">

  🔥 Sticker has been placed!<br>
  sheesh 😎

</div>


<!-- =========================
     MODAL ACHTERGROND
========================= -->

<div id="modalBackground"></div>


<!-- =========================
     STICKER MODAL
========================= -->

<div id="modal">

  <h2>
    🏷️ Sticker maken
  </h2>

  <p>
    Wat moet er op de sticker staan?
  </p>

  <input
    id="stickerText"
    type="text"
    maxlength="40"
    placeholder="Bijvoorbeeld: Heerenveen!"
  >

  <div class="modalButtons">

    <button
      id="publish"
      onclick="publishSticker()"
    >
      Publiceren
    </button>

    <button
      id="cancel"
      onclick="closeModal()"
    >
      Annuleren
    </button>

  </div>

</div>


<!-- =========================
     OPSLAAN ANIMATIE
========================= -->

<div id="saveOverlay">

  <div id="saveBox">

    <div id="loadingCircle"></div>

    <div id="saveTitle">
      Kaart wordt bijgewerkt...
    </div>

    <div id="saveSub">
      Sticker wordt opgeslagen
    </div>


    <div id="successIcon">
      ✓
    </div>

    <div id="successTitle">
      Sticker opgeslagen
    </div>

    <div id="successSub">
      🔥 sheesh!
    </div>

  </div>

</div>


<!-- =========================
     LEAFLET
========================= -->

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* ==========================================
   KAART
========================================== */

const map = L.map(
  "map",
  {
    doubleClickZoom: false
  }
).setView(
  [52.9593, 5.9185],
  12
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {

    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"

  }
).addTo(map);


/* ==========================================
   VARIABELEN
========================================== */

let stickers = [];

let selectedLat = null;

let selectedLng = null;


/* ==========================================
   OPSLAG LADEN
========================================== */

try {

  const saved =
    localStorage.getItem(
      "stickerkaart"
    );

  if (saved) {

    stickers =
      JSON.parse(saved);

  }

} catch (error) {

  stickers = [];

}


/* ==========================================
   PLUS KNOP
========================================== */

function startPlacement() {

  document.getElementById(
    "centerMarker"
  ).style.display =
    "block";


  document.getElementById(
    "placeBar"
  ).style.display =
    "block";

}


/* ==========================================
   LOCATIE KIEZEN
========================================== */

function chooseLocation() {

  const center =
    map.getCenter();


  selectedLat =
    center.lat;


  selectedLng =
    center.lng;


  document.getElementById(
    "centerMarker"
  ).style.display =
    "none";


  document.getElementById(
    "placeBar"
  ).style.display =
    "none";


  document.getElementById(
    "modalBackground"
  ).style.display =
    "block";


  document.getElementById(
    "modal"
  ).style.display =
    "block";


  document.getElementById(
    "stickerText"
  ).value =
    "";


  setTimeout(
    function() {

      document.getElementById(
        "stickerText"
      ).focus();

    },
    100
  );

}


/* ==========================================
   PLAATSING ANNULEREN
========================================== */

function cancelPlacement() {

  document.getElementById(
    "centerMarker"
  ).style.display =
    "none";


  document.getElementById(
    "placeBar"
  ).style.display =
    "none";

}


/* ==========================================
   PUBLICEREN
========================================== */

async function publishSticker() {

  const input =
    document.getElementById(
      "stickerText"
    );


  const text =
    input.value.trim();


  /* TEKST CONTROLEREN */

  if (!text) {

    alert(
      "Vul eerst een tekst in."
    );

    input.focus();

    return;

  }


  /* LOCATIE CONTROLEREN */

  if (
    selectedLat === null ||
    selectedLng === null
  ) {

    alert(
      "Kies eerst een locatie."
    );

    return;

  }


  /* OVERLAY OPENEN */

  const overlay =
    document.getElementById(
      "saveOverlay"
    );


  const loading =
    document.getElementById(
      "loadingCircle"
    );


  const saveTitle =
    document.getElementById(
      "saveTitle"
    );


  const saveSub =
    document.getElementById(
      "saveSub"
    );


  const successIcon =
    document.getElementById(
      "successIcon"
    );


  const successTitle =
    document.getElementById(
      "successTitle"
    );


  const successSub =
    document.getElementById(
      "successSub"
    );


  overlay.style.display =
    "flex";


  loading.style.display =
    "block";


  saveTitle.style.display =
    "block";


  saveSub.style.display =
    "block";


  successIcon.style.display =
    "none";


  successTitle.style.display =
    "none";


  successSub.style.display =
    "none";


  /* NIEUWE STICKER */

  const sticker = {

    id:
      Date.now().toString() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2),

    text:
      text,

    lat:
      selectedLat,

    lng:
      selectedLng,

    created:
      new Date().toISOString()

  };


  try {

    /*
      WACHT 5 SECONDEN
      VOOR DE ANIMATIE
    */

    await wait(5000);


    /* STICKER TOEVOEGEN */

    stickers.push(
      sticker
    );


    /* OPSLAAN */

    localStorage.setItem(
      "stickerkaart",
      JSON.stringify(
        stickers
      )
    );


    /* OP KAART ZETTEN */

    createSticker(
      sticker
    );


    /* TELLER */

    updateCounter();


    /* SPINNER VERBERGEN */

    loading.style.display =
      "none";


    saveTitle.style.display =
      "none";


    saveSub.style.display =
      "none";


    /* SUCCES TONEN */

    successIcon.style.display =
      "block";


    successTitle.style.display =
      "block";


    successSub.style.display =
      "block";


    /* SUCCES 2 SECONDEN */

    await wait(2000);


    /* OVERLAY SLUITEN */

    overlay.style.display =
      "none";


    /* MODAL RESETTEN */

    closeModal();


    /* NOTIFICATIE */

    showNotification();


  } catch (error) {

    console.error(
      error
    );


    overlay.style.display =
      "none";


    alert(
      "Er ging iets fout bij het opslaan."
    );

  }

}


/* ==========================================
   WACHTFUNCTIE
========================================== */

function wait(milliseconds) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        milliseconds
      );

    }
  );

}


/* ==========================================
   STICKER MAKEN
========================================== */

function createSticker(
  sticker
) {

  const icon =
    L.divIcon({

      className: "",

      html:
        '<div class="sticker">' +
        escapeHtml(
          sticker.text
        ) +
        '</div>',

      iconSize:
        [62,62],

      iconAnchor:
        [31,31]

    });


  const marker =
    L.marker(
      [
        sticker.lat,
        sticker.lng
      ],
      {
        icon:
          icon
      }
    )
    .addTo(map);


  const date =
    new Date(
      sticker.created
    );


  const dateText =
    date.toLocaleDateString(
      "nl-NL",
      {
        day:
          "numeric",

        month:
          "long",

        year:
          "numeric"
      }
    );


  marker.bindPopup(

    '<div style="min-width:220px">' +

      '<h3>🏷️ ' +

      escapeHtml(
        sticker.text
      ) +

      '</h3>' +

      '<b>📍 Locatie</b><br>' +

      sticker.lat.toFixed(5) +

      ", " +

      sticker.lng.toFixed(5) +

      '<br><br>' +

      '<b>📅 Aangemaakt</b><br>' +

      dateText +

      '<br><br>' +

      '<button ' +

      'class="delete" ' +

      'onclick="deleteSticker(\'' +

      sticker.id +

      '\')">' +

      '🗑️ Deze sticker verwijderen' +

      '</button>' +

    '</div>'

  );


  /*
    MARKER AAN OBJECT KOPPELEN
  */

  sticker.marker =
    marker;

}


/* ==========================================
   STICKER VERWIJDEREN
========================================== */

function deleteSticker(
  id
) {

  const index =
    stickers.findIndex(
      function(sticker) {

        return sticker.id === id;

      }
    );


  if (index === -1) {

    return;

  }


  const confirmed =
    confirm(
      "Wil je deze sticker verwijderen?"
    );


  if (!confirmed) {

    return;

  }


  if (
    stickers[index].marker
  ) {

    map.removeLayer(
      stickers[index].marker
    );

  }


  stickers.splice(
    index,
    1
  );


  localStorage.setItem(
    "stickerkaart",
    JSON.stringify(
      stickers
    )
  );


  updateCounter();

}


/* ==========================================
   TELLER
========================================== */

function updateCounter() {

  document.getElementById(
    "stickerCount"
  ).textContent =
    stickers.length;

}


/* ==========================================
   SUCCESMELDING
========================================== */

function showNotification() {

  const notification =
    document.getElementById(
      "notification"
    );


  notification.style.display =
    "block";


  setTimeout(
    function() {

      notification.style.display =
        "none";

    },
    3500
  );

}


/* ==========================================
   MODAL SLUITEN
========================================== */

function closeModal() {

  document.getElementById(
    "modal"
  ).style.display =
    "none";


  document.getElementById(
    "modalBackground"
  ).style.display =
    "none";


  selectedLat =
    null;


  selectedLng =
    null;

}


/* ==========================================
   PLAATS ZOEKEN
========================================== */

function searchPlace() {

  const query =
    document
      .getElementById(
        "search"
      )
      .value
      .trim();


  if (!query) {

    return;

  }


  fetch(
    "https://nominatim.openstreetmap.org/search" +

    "?format=json" +

    "&countrycodes=nl" +

    "&limit=1" +

    "&q=" +

    encodeURIComponent(
      query
    )
  )

  .then(
    function(response) {

      return response.json();

    }
  )

  .then(
    function(data) {

      if (
        !data ||
        data.length === 0
      ) {

        alert(
          "Plaats niet gevonden."
        );

        return;

      }


      map.setView(
        [
          Number(
            data[0].lat
          ),

          Number(
            data[0].lon
          )
        ],
        14
      );

    }
  )

  .catch(
    function(error) {

      console.error(
        error
      );

      alert(
        "Zoeken mislukt."
      );

    }
  );

}


/* ==========================================
   ENTER ZOEKEN
========================================== */

document
  .getElementById(
    "search"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        searchPlace();

      }

    }
  );


/* ==========================================
   ENTER PUBLICEREN
========================================== */

document
  .getElementById(
    "stickerText"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        publishSticker();

      }


      if (
        event.key ===
        "Escape"
      ) {

        closeModal();

      }

    }
  );


/* ==========================================
   HTML VEILIG MAKEN
========================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text;


  return div.innerHTML;

}


/* ==========================================
   BESTAANDE STICKERS
========================================== */

stickers.forEach(
  function(sticker) {

    createSticker(
      sticker
    );

  }
);


/* ==========================================
   TELLER BIJ START
========================================== */

updateCounter();

</script>

</body>
</html>
