<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sticker Map</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
  🏷️ Sticker Map

  <span>
    Stickers:
    <b id="counter">0</b>
  </span>
</header>


<div class="search">
  <input id="search" placeholder="Zoek plaats...">
  <button onclick="searchPlace()">🔎</button>
</div>


<div id="map"></div>


<div id="marker">
📍
</div>


<button id="placeBtn" onclick="startPlace()">
📍 Sticker plaatsen
</button>


<div id="confirmBox">

<button onclick="cancelPlace()">
Annuleren
</button>

<button onclick="selectPlace()">
Deze plek kiezen
</button>

</div>


<div id="popup">

<h2>🏷️ Sticker</h2>

<textarea id="text"
placeholder="Sticker tekst"></textarea>

<button onclick="saveSticker()">
Plaatsen
</button>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="script.js"></script>

</body>
</html>
